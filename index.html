<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>السيف</title>
  <script type="module"
    src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
</head>
<body style="margin:0; font-family:sans-serif; text-align:center;">
  <h2>جرّب السيف في مكانك</h2>

  <p>اختار ملف السيف (chevalier_sword.glb):
    <input type="file" id="pick" accept=".glb">
  </p>

  <model-viewer id="mv" ar camera-controls auto-rotate
    environment-image="neutral" shadow-intensity="1"
    style="width:100%; height:65vh;"></model-viewer>

  <script>
    // لو الصفحة على سيرفر هيحمّل الملف تلقائي، ولو على file:// اختار الملف يدوي
    const mv = document.getElementById('mv');
    if (location.protocol !== 'file:') mv.src = 'chevalier_sword.glb';
    document.getElementById('pick').onchange = (e) => {
      mv.src = URL.createObjectURL(e.target.files[0]);
    };
  </script>
</body>
</html>
